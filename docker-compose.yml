services:
  # Ad Service
  adservice:
    build:
      context: ./src/adservice
      dockerfile: Dockerfile
    ports:
      - "9555:9555"
    networks:
      - app-network

  # Cart Database (Redis)
  cartdb:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    command: redis-server --appendonly yes

  # Cart Service
  cartservice:
    build:
      context: ./src/cartservice/src
      dockerfile: Dockerfile
    ports:
      - "7070:7070"
    networks:
      - app-network
    depends_on:
      - cartdb

  # Product Catalog Service
  productcatalogservice:
    build:
      context: ./src/productcatalogservice
      dockerfile: Dockerfile
    ports:
      - "3550:3550"
    networks:
      - app-network

  # Recommendation Service
  recommendationservice:
    build:
      context: ./src/recommendationservice
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - app-network
    depends_on:
      - productcatalogservice
    environment:
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550

  # Shopping Assistant Service
  shoppingassistantservice:
    build:
      context: ./src/shoppingassistantservice
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    networks:
      - app-network
    depends_on:
      - productcatalogservice
      - cartservice
    environment:
      - USE_ALLOYDB=false
      - PROJECT_ID=online-boutique
      - REGION=us-central1
      - ALLOYDB_DATABASE_NAME=products
      - ALLOYDB_TABLE_NAME=product_embeddings
      - ALLOYDB_CLUSTER_NAME=online-boutique-cluster
      - ALLOYDB_INSTANCE_NAME=online-boutique-instance
      - ALLOYDB_SECRET_NAME=postgres-password

  # Currency Service
  currencyservice:
    build:
      context: ./src/currencyservice
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    networks:
      - app-network
    environment:
      - PORT=7000

  # Email Service
  emailservice:
    build:
      context: ./src/emailservice
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    networks:
      - app-network

  # Shipping Service
  shippingservice:
    build:
      context: ./src/shippingservice
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    networks:
      - app-network

  # Payment Service
  paymentservice:
    build:
      context: ./src/paymentservice
      dockerfile: Dockerfile
    ports:
      - "50052:50051"
    networks:
      - app-network
    environment:
      - PORT=50051

  # Checkout Service
  checkoutservice:
    build:
      context: ./src/checkoutservice
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    networks:
      - app-network
    depends_on:
      - cartservice
      - shippingservice
      - emailservice
      - currencyservice
      - paymentservice
      - productcatalogservice
    environment:
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - PAYMENT_SERVICE_ADDR=paymentservice:50051
      - EMAIL_SERVICE_ADDR=emailservice:5000
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070

  # Frontend - Web interface
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - checkoutservice
      - productcatalogservice
      - cartservice
      - recommendationservice
      - shippingservice
      - currencyservice
      - paymentservice
    environment:
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
      - CURRENCY_SERVICE_ADDR=currencyservice:7000
      - CART_SERVICE_ADDR=cartservice:7070
      - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
      - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
      - SHIPPING_SERVICE_ADDR=shippingservice:50051
      - AD_SERVICE_ADDR=adservice:9555
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistantservice:80

  # Load Generator (optional - for load testing)
  loadgenerator:
    build:
      context: ./src/loadgenerator
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=10
      - RATE=1
    depends_on:
      - frontend

networks:
  app-network:
    driver: bridge
