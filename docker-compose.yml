services:
  # Cart Database (Redis)
  cartdb:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    command: redis-server --appendonly yes

  # Cart Service
  cartservice:
    build:
      context: ./src/cartservice/src
      dockerfile: Dockerfile
    ports:
      - "7070:7070"
    networks:
      - app-network
    depends_on:
      - cartdb

  # Product Catalog Service
  productservice:
    build:
      context: ./src/productcatalogservice
      dockerfile: Dockerfile
    ports:
      - "3550:3550"
    networks:
      - app-network

  # Recommendation Service
  recommendationservice:
    build:
      context: ./src/recommendationservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - productservice

  # Shopping Assistant Service
  shoppingassistantservice:
    build:
      context: ./src/shoppingassistantservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - productservice
      - cartservice

  # Currency Service
  currencyservice:
    build:
      context: ./src/currencyservice
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    networks:
      - app-network

  # Email Service
  emailservice:
    build:
      context: ./src/emailservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network

  # Shipping Service
  shippingservice:
    build:
      context: ./src/shippingservice
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    networks:
      - app-network

  # Payment Service
  paymentservice:
    build:
      context: ./src/paymentservice
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    networks:
      - app-network
    environment:
      - PORT=50051

  # Checkout Service
  checkoutservice:
    build:
      context: ./src/checkoutservice
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    networks:
      - app-network
    depends_on:
      - cartservice
      - shippingservice
      - emailservice
      - currencyservice
      - paymentservice
      - productservice

  # Frontend - Web interface
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - checkoutservice
      - productservice
      - cartservice
      - recommendationservice
      - shippingservice
      - currencyservice
      - paymentservice

  # Load Generator (optional - for load testing)
  loadgenerator:
    build:
      context: ./src/loadgenerator
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      - FRONTEND_ADDR=frontend:8080
      - USERS=10
      - RATE=1
    depends_on:
      - frontend

networks:
  app-network:
    driver: bridge